[project]
name = "multi-agent-rag-system"
version = "0.1.0"
description = "A multi-agent document chat with Galileo evaluations"
license = "MIT"
requires-python = "<3.14,>=3.11"
dependencies = [
  "phidata>=2.0.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.28.0",
  "memvid>=0.1.0",
  "PyPDF2>=3.0.0",
  "groq>=0.3.0",
  "faiss-cpu>=1.7.4",
  "google-generativeai",
  "duckduckgo-search>=3.9.0",
  "galileo>=1.3.0",
]
[dependency-groups]
dev = [
    "ruff>=0.11.11",
]

[tool.ruff]
line-length = 120
